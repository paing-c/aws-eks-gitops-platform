apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: demo-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
          volumeMounts:
            - name: web-html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: web-html
          configMap:
            name: web-html
