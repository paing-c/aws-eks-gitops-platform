apiVersion: v1
kind: ConfigMap
metadata:
  name: web-html
  namespace: demo-app
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Amazon EKS GitOps Platform</title>
      <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; }
        body {
          margin: 0;
          min-height: 100vh;
          display: grid;
          place-items: center;
          background: radial-gradient(ellipse at top, #162c3d, #0a111a 65%);
          color: #eef5fb;
        }
        main { width: min(42rem, calc(100% - 3rem)); padding: 3rem 0; }
        .version { color: #80ecd1; font: 0.9rem ui-monospace, monospace; }
        h1 { font-size: clamp(2.5rem, 8vw, 5rem); line-height: 1; margin: 1rem 0; }
        p { color: #afc4d6; font-size: 1.15rem; }
      </style>
    </head>
    <body>
      <main>
        <p class="version">Version: v1.0.0</p>
        <h1>Amazon EKS GitOps Platform</h1>
        <p>Terraform + Amazon EKS + ArgoCD</p>
      </main>
    </body>
    </html>
